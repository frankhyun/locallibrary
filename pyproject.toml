[project]
name = "locallibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1.1",
    "django-allauth>=65.21.0",
    "django-environ>=0.14.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pylint-django>=2.8.0",
    "selenium>=4.51.0",
]
prod = [
    "psycopg[binary]>=3.3.6",
]
