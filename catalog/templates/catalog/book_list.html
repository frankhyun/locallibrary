<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books - Local Library</title>
</head>
<body>
    <main>
        <h1>Books</h1>
        <ul>
            {% for book in books %}
                <li>
                    <a href="{{ book.get_absolute_url }}">{{ book.title }}</a>
                    by
                    {% for author in book.authors.all %}
                        <a href="{{ author.get_absolute_url }}">{{ author }}</a>{% if not forloop.last %}, {% endif %}
                    {% empty %}
                        Unknown author
                    {% endfor %}
                </li>
            {% empty %}
                <li>No books are available.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
